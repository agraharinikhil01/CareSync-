<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Soft shadow filter for database tables -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ================= 1. ENTITY TABLES ================= -->

  <!-- DEPARTMENT TABLE -->
  <g id="table-department" filter="url(#box-shadow)">
    <!-- Header -->
    <rect x="350" y="40" width="160" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="430" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DEPARTMENT</text>
    <!-- Body -->
    <rect x="350" y="68" width="160" height="66" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="360" y="86" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>department_id</text>
    <text x="360" y="104" font-size="11" fill="#333333">dept_name</text>
    <text x="360" y="122" font-size="11" fill="#333333">head_doctor_id</text>
  </g>

  <!-- DOCTOR TABLE -->
  <g id="table-doctor" filter="url(#box-shadow)">
    <rect x="180" y="190" width="155" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="257" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DOCTOR</text>
    <rect x="180" y="218" width="155" height="102" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="190" y="236" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>doctor_id</text>
    <text x="190" y="254" font-size="11" fill="#333333">name</text>
    <text x="190" y="272" font-size="11" fill="#333333">specialization</text>
    <text x="190" y="290" font-size="11" fill="#333333">contact_no</text>
    <text x="190" y="308" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>department_id</text>
  </g>

  <!-- PATIENT TABLE -->
  <g id="table-patient" filter="url(#box-shadow)">
    <rect x="380" y="180" width="140" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="450" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">PATIENT</text>
    <rect x="380" y="208" width="140" height="118" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="390" y="226" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>patient_id</text>
    <text x="390" y="244" font-size="11" fill="#333333">name</text>
    <text x="390" y="262" font-size="11" fill="#333333">dob</text>
    <text x="390" y="280" font-size="11" fill="#333333">gender</text>
    <text x="390" y="298" font-size="11" fill="#333333">contact_no</text>
    <text x="390" y="316" font-size="11" fill="#333333">blood_group</text>
  </g>

  <!-- STAFF TABLE -->
  <g id="table-staff" filter="url(#box-shadow)">
    <rect x="560" y="200" width="145" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="632" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">STAFF</text>
    <rect x="560" y="228" width="145" height="85" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="570" y="246" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>staff_id</text>
    <text x="570" y="264" font-size="11" fill="#333333">name</text>
    <text x="570" y="282" font-size="11" fill="#333333">role</text>
    <text x="570" y="300" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>department_id</text>
  </g>

  <!-- WARD TABLE -->
  <g id="table-ward" filter="url(#box-shadow)">
    <rect x="740" y="210" width="115" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="797" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">WARD</text>
    <rect x="740" y="238" width="115" height="68" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="748" y="256" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>ward_id</text>
    <text x="748" y="274" font-size="11" fill="#333333">ward_type</text>
    <text x="748" y="292" font-size="11" fill="#333333">capacity</text>
  </g>

  <!-- APPOINTMENT TABLE -->
  <g id="table-appointment" filter="url(#box-shadow)">
    <rect x="175" y="370" width="165" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="257" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">APPOINTMENT</text>
    <rect x="175" y="398" width="165" height="120" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="185" y="416" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>appointment_id</text>
    <text x="185" y="434" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>patient_id</text>
    <text x="185" y="452" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>doctor_id</text>
    <text x="185" y="470" font-size="11" fill="#333333">date</text>
    <text x="185" y="488" font-size="11" fill="#333333">time_slot</text>
    <text x="185" y="506" font-size="11" fill="#333333">status</text>
  </g>

  <!-- ADMISSION TABLE -->
  <g id="table-admission" filter="url(#box-shadow)">
    <rect x="645" y="380" width="140" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="715" y="399" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">ADMISSION</text>
    <rect x="645" y="408" width="140" height="102" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="655" y="426" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>admission_id</text>
    <text x="655" y="444" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>patient_id</text>
    <text x="655" y="462" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>ward_id</text>
    <text x="655" y="480" font-size="11" fill="#333333">admit_date</text>
    <text x="655" y="498" font-size="11" fill="#333333">discharge_date</text>
  </g>

  <!-- PRESCRIPTION TABLE -->
  <g id="table-prescription" filter="url(#box-shadow)">
    <rect x="165" y="550" width="155" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="242" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">PRESCRIPTION</text>
    <rect x="165" y="578" width="155" height="85" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="175" y="596" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>prescription_id</text>
    <text x="175" y="614" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>appointment_id</text>
    <text x="175" y="632" font-size="11" fill="#333333">medicines</text>
    <text x="175" y="650" font-size="11" fill="#333333">dosage_notes</text>
  </g>

  <!-- BILL TABLE -->
  <g id="table-bill" filter="url(#box-shadow)">
    <rect x="365" y="540" width="155" height="28" fill="#1b365d" rx="2" ry="2" />
    <text x="442" y="559" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">BILL</text>
    <rect x="365" y="568" width="155" height="102" fill="#ffffff" stroke="#1b365d" stroke-width="1.5" />
    <text x="375" y="586" font-size="11" fill="#1b365d"><tspan font-weight="bold">PK </tspan>bill_id</text>
    <text x="375" y="604" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>patient_id</text>
    <text x="375" y="622" font-size="11" fill="#1b365d"><tspan font-weight="bold">FK </tspan>appointment_id</text>
    <text x="375" y="640" font-size="11" fill="#333333">amount</text>
    <text x="375" y="658" font-size="11" fill="#333333">payment_status</text>
  </g>


  <!-- ================= 2. RELATIONSHIP LINES & CARDINALITIES ================= -->

  <!-- Department -> Doctor (1 to M) -->
  <line x1="380" y1="134" x2="280" y2="190" stroke="#1b365d" stroke-width="1.5" />
  <text x="385" y="152" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="290" y="180" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Department -> Staff (1 to M) -->
  <line x1="475" y1="134" x2="600" y2="200" stroke="#1b365d" stroke-width="1.5" />
  <text x="470" y="152" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="590" y="185" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Doctor -> Appointment (1 to M) -->
  <line x1="257" y1="320" x2="257" y2="370" stroke="#1b365d" stroke-width="1.5" />
  <text x="245" y="340" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="245" y="360" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Patient -> Appointment (1 to M) -->
  <line x1="400" y1="326" x2="310" y2="370" stroke="#1b365d" stroke-width="1.5" />
  <text x="385" y="345" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="320" y="360" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Patient -> Admission (1 to M) -->
  <line x1="510" y1="326" x2="655" y2="380" stroke="#1b365d" stroke-width="1.5" />
  <text x="535" y="345" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="635" y="370" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Ward -> Admission (1 to M) -->
  <line x1="770" y1="306" x2="730" y2="380" stroke="#1b365d" stroke-width="1.5" />
  <text x="765" y="330" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="738" y="365" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Patient -> Bill (1 to M) -->
  <line x1="440" y1="326" x2="440" y2="540" stroke="#1b365d" stroke-width="1.5" />
  <text x="448" y="350" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="448" y="525" font-size="11" font-weight="bold" fill="#1b365d">M</text>

  <!-- Appointment -> Prescription (1 to 1) -->
  <line x1="245" y1="518" x2="245" y2="550" stroke="#1b365d" stroke-width="1.5" />
  <text x="235" y="533" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="252" y="533" font-size="11" font-weight="bold" fill="#1b365d">1</text>

  <!-- Appointment -> Bill (1 to 1) -->
  <line x1="330" y1="518" x2="380" y2="540" stroke="#1b365d" stroke-width="1.5" />
  <text x="338" y="535" font-size="11" font-weight="bold" fill="#1b365d">1</text>
  <text x="375" y="533" font-size="11" font-weight="bold" fill="#1b365d">1</text>


  <!-- ================= CAPTION ================= -->
  <text x="450" y="725" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2d3748">
    Figure 4.4: Entity-Relationship Diagram
  </text>
</svg>
