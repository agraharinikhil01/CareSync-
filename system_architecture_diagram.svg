<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e4e79" />
    </marker>
    <!-- Shadow Filter for clean professional look -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ================= 1. PRESENTATION LAYER ================= -->
  <g id="presentation-layer">
    <!-- Outer Container -->
    <rect x="80" y="30" width="690" height="110" rx="20" ry="20" fill="#d9e6f3" stroke="#2a5c8a" stroke-width="2" />
    <text x="425" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c3d5a">Presentation Layer</text>

    <!-- 4 Sub-Panels -->
    <!-- Admin Panel -->
    <rect x="105" y="75" width="130" height="48" rx="24" ry="24" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="170" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3d5a">Admin Panel</text>

    <!-- Receptionist Panel -->
    <rect x="255" y="75" width="150" height="48" rx="24" ry="24" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="330" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Receptionist</text>
    <text x="330" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Panel</text>

    <!-- Doctor Portal -->
    <rect x="425" y="75" width="140" height="48" rx="24" ry="24" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="495" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3d5a">Doctor Portal</text>

    <!-- Patient Portal -->
    <rect x="585" y="75" width="140" height="48" rx="24" ry="24" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="655" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3d5a">Patient Portal</text>
  </g>

  <!-- Arrows from Presentation Layer to Central Auth -->
  <path d="M 170 123 L 170 160 L 370 190" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 330 123 L 330 160 L 390 190" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 495 123 L 495 160 L 460 190" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 655 123 L 655 160 L 480 190" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ================= 2. APPLICATION LAYER ================= -->
  <g id="application-layer">
    <!-- Outer Container -->
    <rect x="40" y="165" width="770" height="225" rx="24" ry="24" fill="#d9e6f3" stroke="#2a5c8a" stroke-width="2" />
    <text x="425" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c3d5a">Application Layer (Node.js &amp; Express Framework)</text>

    <!-- Central Box: Authentication & RBAC -->
    <rect x="300" y="200" width="250" height="52" rx="26" ry="26" fill="#ffffff" stroke="#2a5c8a" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="425" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c3d5a">Authentication &amp;</text>
    <text x="425" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c3d5a">Role-Based Access Control</text>

    <!-- Branching Arrows from Auth to Engines -->
    <path d="M 320 252 L 145 295" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
    <path d="M 380 252 L 320 295" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
    <path d="M 470 252 L 530 295" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
    <path d="M 530 252 L 705 295" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- 4 Bottom Engines -->
    <!-- Appointment Engine -->
    <rect x="65" y="300" width="160" height="58" rx="28" ry="28" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="145" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Appointment</text>
    <text x="145" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Engine</text>

    <!-- Billing & Invoicing Engine -->
    <rect x="245" y="300" width="160" height="58" rx="28" ry="28" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="325" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Billing &amp;</text>
    <text x="325" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Invoicing Engine</text>

    <!-- Bed & Ward Inventory Manager -->
    <rect x="445" y="300" width="165" height="58" rx="28" ry="28" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="527" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Bed &amp; Ward</text>
    <text x="527" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Inventory Manager</text>

    <!-- Prescription / Report Generator -->
    <rect x="630" y="300" width="160" height="58" rx="28" ry="28" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <text x="710" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Prescription &amp;</text>
    <text x="710" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5a">Report Generator</text>
  </g>

  <!-- Arrows from Application Layer to Data Layer -->
  <path d="M 145 358 L 145 448" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 325 358 L 325 448" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 527 358 L 527 448" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 710 358 L 710 448" fill="none" stroke="#1e4e79" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ================= 3. DATA LAYER ================= -->
  <g id="data-layer">
    <!-- Outer Container -->
    <rect x="110" y="415" width="630" height="135" rx="20" ry="20" fill="#d9e6f3" stroke="#2a5c8a" stroke-width="2" />
    <text x="425" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c3d5a">Data Layer (MongoDB Database)</text>

    <!-- Database Cylinder Shape -->
    <!-- Cylinder Body & Bottom -->
    <path d="M 140 472 L 140 515 A 285 24 0 0 0 710 515 L 710 472 Z" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" />
    <!-- Cylinder Top Cap -->
    <ellipse cx="425" cy="472" rx="285" ry="18" fill="#ffffff" stroke="#2a5c8a" stroke-width="1.8" />
    
    <!-- Database Content Text -->
    <text x="425" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#1c3d5a" letter-spacing="0.5">
      Patients  |  Doctors  |  Appointments  |  Billing  |  Beds / Inventory  |  Users &amp; Staff
    </text>
  </g>

  <!-- Caption -->
  <text x="425" y="590" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2d3748">
    Figure 4.1: Three-Tier System Architecture
  </text>
</svg>
