<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System - Use Case Diagram (Figure 4.2)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
    .card { background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); max-width: 850px; width: 100%; text-align: center; }
    .header { margin-bottom: 25px; }
    .header h1 { font-size: 24px; color: #0f172a; margin-bottom: 6px; }
    .header p { font-size: 14px; color: #64748b; }
    .diagram-container { width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background: #ffffff; }
    svg { width: 100%; height: auto; max-height: 850px; }
    .actions { margin-top: 25px; display: flex; justify-content: center; gap: 15px; }
    .btn { padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #0284c7; color: #ffffff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    @media print { body { background: #ffffff; padding: 0; } .card { box-shadow: none; padding: 0; max-width: 100%; } .actions, .header p { display: none; } .diagram-container { border: none; padding: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Chapter 4: System Design</h1>
      <p>Figure 4.2: Role-Based System Use Case Diagram</p>
    </div>

    <div class="diagram-container">

        <defs>
          <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
          </filter>
        </defs>

        <!-- SYSTEM BOUNDARY -->
        <g id="system-boundary">
          <rect x="330" y="80" width="310" height="770" rx="20" ry="20" fill="#ffffff" stroke="#254e70" stroke-width="2.5" />
          <text x="485" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b3b5a">Hospital Management System</text>
        </g>

        <!-- USE CASE OVALS -->
        <g id="uc6" filter="url(#card-shadow)">
          <ellipse cx="485" cy="155" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
          <text x="485" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc6</text>
          <text x="485" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">View Bill / Invoice</text>
        </g>

        <g id="uc2" filter="url(#card-shadow)">
          <ellipse cx="485" cy="220" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
          <text x="485" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc2</text>
          <text x="485" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Book / Cancel Appointment</text>
        </g>

        <g id="uc1" filter="url(#card-shadow)">

        <g id="uc5" filter="url(#card-shadow)">

          <text x="485" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Generate Bill</text>

        <g id="uc3" filter="url(#card-shadow)">
          <ellipse cx="485" cy="480" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
          <text x="485" y="475" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc3</text>
          <text x="485" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">View Medical History</text>
        </g>

        <g id="uc11" filter="url(#card-shadow)">

          <text x="485" y="620" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b3b5a">Update Diagnosis &amp; Prescription</text>
        </g>

        <g id="uc8" filter="url(#card-shadow)">

          <text x="485" y="815" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Generate Reports</text>
        </g>

        <g id="actor-patient" filter="url(#card-shadow)">

          <text x="147" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3b5a">Patient</text>

        </g>

        <!-- CONNECTING LINES -->
        <!-- Patient -->
        <path d="M 205 250 C 260 200, 310 160, 387 155" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 255 C 270 240, 320 225, 387 220" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 260 C 270 270, 320 280, 387 285" fill="none" stroke="#254e70" stroke-width="1.6" />

        <path d="M 205 340 C 270 280, 310 230, 387 225" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 345 C 270 315, 320 295, 387 290" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 350 L 387 350" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 355 C 270 380, 320 405, 387 415" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 360 C 270 410, 310 460, 387 480" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 365 C 270 440, 310 520, 387 545" fill="none" stroke="#254e70" stroke-width="1.6" />

        <!-- Doctor -->
        <path d="M 205 535 C 270 500, 320 485, 387 480" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 545 L 387 545" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 550 C 270 580, 310 600, 381 610" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 555 C 270 610, 310 655, 387 675" fill="none" stroke="#254e70" stroke-width="1.6" />

        <!-- Admin -->
        <path d="M 205 655 C 260 600, 310 560, 387 545" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 665 C 270 670, 320 675, 387 675" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 670 C 270 700, 320 730, 387 740" fill="none" stroke="#254e70" stroke-width="1.6" />
        <path d="M 205 675 C 270 730, 310 785, 387 805" fill="none" stroke="#254e70" stroke-width="1.6" />

        <!-- CAPTION -->
        <text x="485" y="895" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2d3748">
          Figure 4.2: Use Case Diagram
        </text>
      </svg>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>

    </div>
  </div>
</body>
</html>
