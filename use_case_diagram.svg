<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 960" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Soft Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <g id="system-boundary">
    <!-- Main Outer Container Box -->
    <rect x="330" y="80" width="310" height="770" rx="20" ry="20" fill="#ffffff" stroke="#254e70" stroke-width="2.5" />
    <text x="485" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b3b5a">Hospital Management System</text>
  </g>

  <!-- ================= USE CASE OVALS ================= -->
  <!-- uc6: View Bill / Invoice -->
  <g id="uc6" filter="url(#card-shadow)">
    <ellipse cx="485" cy="155" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc6</text>
    <text x="485" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">View Bill / Invoice</text>
  </g>

  <!-- uc2: Book / Cancel Appointment -->
  <g id="uc2" filter="url(#card-shadow)">
    <ellipse cx="485" cy="220" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc2</text>
    <text x="485" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Book / Cancel Appointment</text>
  </g>

  <!-- uc1: Register Patient -->
  <g id="uc1" filter="url(#card-shadow)">
    <ellipse cx="485" cy="285" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc1</text>
    <text x="485" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Register Patient</text>
  </g>

  <!-- uc7: Admit / Discharge Patient -->
  <g id="uc7" filter="url(#card-shadow)">
    <ellipse cx="485" cy="350" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc7</text>
    <text x="485" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Admit / Discharge Patient</text>
  </g>

  <!-- uc5: Generate Bill -->
  <g id="uc5" filter="url(#card-shadow)">
    <ellipse cx="485" cy="415" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc5</text>
    <text x="485" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Generate Bill</text>
  </g>

  <!-- uc3: View Medical History -->
  <g id="uc3" filter="url(#card-shadow)">
    <ellipse cx="485" cy="480" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="475" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc3</text>
    <text x="485" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">View Medical History</text>
  </g>

  <!-- uc11: Login / Authenticate -->
  <g id="uc11" filter="url(#card-shadow)">
    <ellipse cx="485" cy="545" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc11</text>
    <text x="485" y="555" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Login / Authenticate</text>
  </g>

  <!-- uc4: Update Diagnosis & Prescription -->
  <g id="uc4" filter="url(#card-shadow)">
    <ellipse cx="485" cy="610" rx="104" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="605" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc4</text>
    <text x="485" y="620" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b3b5a">Update Diagnosis &amp; Prescription</text>
  </g>

  <!-- uc8: Manage Doctor Schedule -->
  <g id="uc8" filter="url(#card-shadow)">
    <ellipse cx="485" cy="675" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="670" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc8</text>
    <text x="485" y="685" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Manage Doctor Schedule</text>
  </g>

  <!-- uc9: Manage Medicine / Inventory -->
  <g id="uc9" filter="url(#card-shadow)">
    <ellipse cx="485" cy="740" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="735" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc9</text>
    <text x="485" y="750" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Manage Inventory &amp; Beds</text>
  </g>

  <!-- uc10: Generate Reports -->
  <g id="uc10" filter="url(#card-shadow)">
    <ellipse cx="485" cy="805" rx="98" ry="25" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="485" y="800" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">uc10</text>
    <text x="485" y="815" text-anchor="middle" font-size="12" font-weight="600" fill="#1b3b5a">Generate Reports</text>
  </g>


  <!-- ================= ACTOR CAPSULES (LEFT) ================= -->
  <!-- 1. Patient Actor -->
  <g id="actor-patient" filter="url(#card-shadow)">
    <rect x="90" y="240" width="115" height="36" rx="18" ry="18" fill="#ffffff" stroke="#254e70" stroke-width="2" />
    <text x="147" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3b5a">Patient</text>
  </g>

  <!-- 2. Receptionist Actor -->
  <g id="actor-receptionist" filter="url(#card-shadow)">
    <rect x="90" y="325" width="115" height="36" rx="18" ry="18" fill="#ffffff" stroke="#254e70" stroke-width="2" />
    <text x="147" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3b5a">Receptionist</text>
  </g>

  <!-- 3. Doctor Actor -->
  <g id="actor-doctor" filter="url(#card-shadow)">
    <rect x="90" y="525" width="115" height="36" rx="18" ry="18" fill="#ffffff" stroke="#254e70" stroke-width="2" />
    <text x="147" y="548" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3b5a">Doctor</text>
  </g>

  <!-- 4. Admin Actor -->
  <g id="actor-admin" filter="url(#card-shadow)">
    <rect x="90" y="650" width="115" height="36" rx="18" ry="18" fill="#ffffff" stroke="#254e70" stroke-width="2" />
    <text x="147" y="673" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3b5a">Admin</text>
  </g>


  <!-- ================= CONNECTING LINES (ACTORS -> USE CASES) ================= -->
  <!-- Patient Connections -->
  <path d="M 205 250 C 260 200, 310 160, 387 155" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc6 View Bill -->
  <path d="M 205 255 C 270 240, 320 225, 387 220" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc2 Book Appt -->
  <path d="M 205 260 C 270 270, 320 280, 387 285" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc1 Register -->
  <path d="M 205 265 C 280 340, 320 440, 387 480" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc3 Medical History -->
  <path d="M 205 270 C 270 370, 310 490, 387 545" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc11 Login -->

  <!-- Receptionist Connections -->
  <path d="M 205 335 C 250 250, 310 170, 387 160" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc6 View Bill -->
  <path d="M 205 340 C 270 280, 310 230, 387 225" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc2 Book Appt -->
  <path d="M 205 345 C 270 315, 320 295, 387 290" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc1 Register -->
  <path d="M 205 350 L 387 350" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc7 Admit/Discharge -->
  <path d="M 205 355 C 270 380, 320 405, 387 415" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc5 Generate Bill -->
  <path d="M 205 360 C 270 410, 310 460, 387 480" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc3 Medical History -->
  <path d="M 205 365 C 270 440, 310 520, 387 545" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc11 Login -->

  <!-- Doctor Connections -->
  <path d="M 205 535 C 270 500, 320 485, 387 480" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc3 Medical History -->
  <path d="M 205 545 L 387 545" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc11 Login -->
  <path d="M 205 550 C 270 580, 310 600, 381 610" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc4 Diagnosis & Rx -->
  <path d="M 205 555 C 270 610, 310 655, 387 675" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc8 Doctor Schedule -->

  <!-- Admin Connections -->
  <path d="M 205 655 C 260 600, 310 560, 387 545" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc11 Login -->
  <path d="M 205 665 C 270 670, 320 675, 387 675" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc8 Doctor Schedule -->
  <path d="M 205 670 C 270 700, 320 730, 387 740" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc9 Manage Inventory -->
  <path d="M 205 675 C 270 730, 310 785, 387 805" fill="none" stroke="#254e70" stroke-width="1.6" /> <!-- to uc10 Generate Reports -->

  <!-- ================= CAPTION ================= -->
  <text x="485" y="895" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2d3748">
    Figure 4.2: Use Case Diagram
  </text>
</svg>
