<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#254e70" />
    </marker>
    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- ================= 1. EXTERNAL ENTITIES (RECTANGLES) ================= -->
  <!-- Admin Entity -->
  <g id="entity-admin" filter="url(#soft-shadow)">
    <rect x="50" y="80" width="85" height="40" fill="#ffffff" stroke="#254e70" stroke-width="1.8" />
    <text x="92" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3b5a">Admin</text>
  </g>

  <!-- Patient Entity -->
  <g id="entity-patient" filter="url(#soft-shadow)">
    <rect x="50" y="270" width="85" height="45" fill="#ffffff" stroke="#254e70" stroke-width="1.8" />
    <text x="92" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3b5a">Patient</text>
  </g>

  <!-- Doctor Entity -->
  <g id="entity-doctor" filter="url(#soft-shadow)">
    <rect x="430" y="365" width="85" height="40" fill="#ffffff" stroke="#254e70" stroke-width="1.8" />
    <text x="472" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3b5a">Doctor</text>
  </g>


  <!-- ================= 2. PROCESSES (CIRCLES) ================= -->
  <!-- 5.0 Inventory Management -->
  <g id="process-5" filter="url(#soft-shadow)">
    <circle cx="280" cy="100" r="42" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="280" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3b5a">5.0</text>
    <text x="280" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#1b3b5a">Inventory</text>
    <text x="280" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#1b3b5a">Management</text>
  </g>

  <!-- 1.0 Registration -->
  <g id="process-1" filter="url(#soft-shadow)">
    <circle cx="360" cy="190" r="40" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="360" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3b5a">1.0</text>
    <text x="360" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1b3b5a">Registration</text>
  </g>

  <!-- 2.0 Appointment Scheduling -->
  <g id="process-2" filter="url(#soft-shadow)">
    <circle cx="280" cy="290" r="42" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="280" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3b5a">2.0</text>
    <text x="280" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#1b3b5a">Appointment</text>
    <text x="280" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#1b3b5a">Scheduling</text>
  </g>

  <!-- 3.0 Consultation & Prescription -->
  <g id="process-3" filter="url(#soft-shadow)">
    <circle cx="610" cy="300" r="44" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="610" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3b5a">3.0</text>
    <text x="610" y="305" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1b3b5a">Consultation &amp;</text>
    <text x="610" y="318" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1b3b5a">Prescription</text>
  </g>

  <!-- 4.0 Billing -->
  <g id="process-4" filter="url(#soft-shadow)">
    <circle cx="740" cy="320" r="40" fill="#d4e4f7" stroke="#254e70" stroke-width="1.8" />
    <text x="740" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3b5a">4.0</text>
    <text x="740" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#1b3b5a">Billing</text>
  </g>


  <!-- ================= 3. DATA STORES (DOUBLE HORIZONTAL LINES) ================= -->
  <!-- D4 | Medicine DB -->
  <g id="store-d4">
    <line x1="410" y1="92" x2="495" y2="92" stroke="#254e70" stroke-width="2.5" />
    <line x1="410" y1="116" x2="495" y2="116" stroke="#254e70" stroke-width="2.5" />
    <rect x="410" y="93" width="85" height="22" fill="#e8f1fa" />
    <text x="452" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1b3b5a">D4 | Medicine DB</text>
  </g>

  <!-- D1 | Patient DB -->
  <g id="store-d1">
    <line x1="710" y1="210" x2="790" y2="210" stroke="#254e70" stroke-width="2.5" />
    <line x1="710" y1="234" x2="790" y2="234" stroke="#254e70" stroke-width="2.5" />
    <rect x="710" y="211" width="80" height="22" fill="#e8f1fa" />
    <text x="750" y="226" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1b3b5a">D1 | Patient DB</text>
  </g>

  <!-- D2 | Appointment DB -->
  <g id="store-d2">
    <line x1="400" y1="258" x2="495" y2="258" stroke="#254e70" stroke-width="2.5" />
    <line x1="400" y1="282" x2="495" y2="282" stroke="#254e70" stroke-width="2.5" />
    <rect x="400" y="259" width="95" height="22" fill="#e8f1fa" />
    <text x="447" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#1b3b5a">D2 | Appointment DB</text>
  </g>

  <!-- D3 | Billing DB -->
  <g id="store-d3">
    <line x1="840" y1="310" x2="920" y2="310" stroke="#254e70" stroke-width="2.5" />
    <line x1="840" y1="334" x2="920" y2="334" stroke="#254e70" stroke-width="2.5" />
    <rect x="840" y="311" width="80" height="22" fill="#e8f1fa" />
    <text x="880" y="326" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1b3b5a">D3 | Billing DB</text>
  </g>


  <!-- ================= 4. DATA FLOW ARROWS ================= -->
  <!-- Admin -> 5.0 Inventory -->
  <path d="M 135 100 L 235 100" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="185" y="93" text-anchor="middle" font-size="10" fill="#334155">stock update</text>

  <!-- 5.0 Inventory -> D4 Medicine DB -->
  <path d="M 322 104 L 405 104" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="365" y="96" text-anchor="middle" font-size="10" fill="#334155">stock levels</text>

  <!-- Patient -> 1.0 Registration -->
  <path d="M 115 270 C 150 200, 230 185, 316 188" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="195" y="210" text-anchor="middle" font-size="10" fill="#334155">personal &amp; medical info</text>

  <!-- 1.0 Registration -> D1 Patient DB -->
  <path d="M 400 190 C 500 185, 600 190, 705 215" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="535" y="185" text-anchor="middle" font-size="10" fill="#334155">store record</text>

  <!-- Patient -> 2.0 Appointment Scheduling -->
  <path d="M 135 290 L 235 290" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="185" y="283" text-anchor="middle" font-size="10" fill="#334155">appointment request</text>

  <!-- 2.0 Appointment Scheduling -> D2 Appointment DB -->
  <path d="M 322 280 L 395 272" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="360" y="268" text-anchor="middle" font-size="9.5" fill="#334155">store booking</text>

  <!-- D2 Appointment DB -> 3.0 Consultation -->
  <path d="M 495 272 L 565 288" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="532" y="272" text-anchor="middle" font-size="9.5" fill="#334155">patient schedule</text>

  <!-- Doctor -> 3.0 Consultation -->
  <path d="M 515 375 C 550 360, 565 345, 580 332" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="538" y="360" text-anchor="middle" font-size="9.5" fill="#334155">diagnosis / Rx</text>

  <!-- 3.0 Consultation -> D1 Patient DB -->
  <path d="M 645 275 C 670 255, 685 240, 705 230" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="680" y="258" text-anchor="middle" font-size="9.5" fill="#334155">update history</text>

  <!-- 3.0 Consultation -> 4.0 Billing -->
  <path d="M 654 305 L 696 312" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="675" y="300" text-anchor="middle" font-size="9.5" fill="#334155">service details</text>

  <!-- 4.0 Billing -> D3 Billing DB -->
  <path d="M 780 322 L 835 322" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="807" y="315" text-anchor="middle" font-size="9.5" fill="#334155">finalize record</text>

  <!-- 4.0 Billing -> Patient (Bottom Curved Feedback Line) -->
  <path d="M 720 355 C 620 450, 240 440, 80 317" fill="none" stroke="#254e70" stroke-width="1.6" marker-end="url(#dfd-arrow)" />
  <text x="440" y="420" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">bill / receipt</text>


  <!-- ================= CAPTION ================= -->
  <text x="500" y="520" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2d3748">
    Figure 4.3: Level-1 Data Flow Diagram
  </text>
</svg>
